</head>
<body>
    <div class="fundo"></div>
    <div class="login">
        <h1>Criar Conta </h1>
        <input type="text" id="nome" placeholder="Digite a porra do seu nome">

        <div class="criesenha">

        <span id="olhos">👁️</span>
        </div>
        <input type="password" id="confirmarsenha" placeholder="Confirme a senha, pq ela não confirmou seu amor">
        <button id="cadastrar">Criar a Conta</button>
        <p id="mensagem_cadastro"></p>
        <div class="links">
            <a href="login.html">Já tenho uma Conta</a>
        </div>
    </div>
