<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="login.css">
    <title>Redefinir Senha</title>
</head>
<body>
    <div class="fundo">
        <h1 id="donde">Donde queres?</h1>
    </div>
    <div class="login">
        <h1>Redefinir essa porcaria</h1>
        <input type="email" id="email" placeholder="Digite seu email aqui🖕">
        <p id="mensagem_redefinir"></p>
        <button id="redefinir">Redefinir Senha🤬</button>
        <div class="novaSenhaArea" style="display: none;">
            <input type="password"
            id="novaSenha"
            placeholder="Digite ali, na barra de pesquisa">
            <input type="password"
            id="confimarNovaSenha"
            placeholder="Confirme aqui">
            <button id="salvarSenha">Alterar senha</button>
        </div>
        <div class="links">
        <a href="login.html">Entrar</a>
        <a href="cadastro.html">Criar uma conta</a>
       </div>
    </div>
    <footer>Todos os Direitos reservado a o Pai😎🤙</footer>
    <script src="redefinir.js"></script>
</body>
</html>
